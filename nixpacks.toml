providers = ["ruby"]

[phases.setup]
aptPkgs = ["...", "libreoffice", "ghostscript", "poppler-utils", "imagemagick", "fontconfig", "default-jre"]

[phases.install_fonts]
dependsOn = ["setup"]
cmds = [
  "echo ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true | debconf-set-selections",
  "DEBIAN_FRONTEND=noninteractive apt-get install -y ttf-mscorefonts-installer",
  "fc-cache -f -v"
]

[phases.fix_imagemagick_policy]
dependsOn = ["setup"]
cmds = [
  "sed -i 's/<policy domain=\"coder\" rights=\"none\" pattern=\"PDF\" \\/>/<policy domain=\"coder\" rights=\"read | write\" pattern=\"PDF\" \\/>/g' /etc/ImageMagick-6/policy.xml"
]
